<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3b2414">
    <title>Mukadma Password Reset</title>
    <link rel="icon" href="./assets/favicon.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="reset-panel" aria-labelledby="page-title">
        <img class="brand-logo" src="./assets/mukoddoma_logo_en_whitebg.svg" alt="Mukadma">
        <div class="lock-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M7 10V8a5 5 0 0 1 10 0v2h1.25A1.75 1.75 0 0 1 20 11.75v7.5A1.75 1.75 0 0 1 18.25 21H5.75A1.75 1.75 0 0 1 4 19.25v-7.5A1.75 1.75 0 0 1 5.75 10H7Zm2 0h6V8a3 3 0 1 0-6 0v2Zm3 3.75a1.25 1.25 0 0 0-.75 2.25v1.5a.75.75 0 0 0 1.5 0V16A1.25 1.25 0 0 0 12 13.75Z"/>
          </svg>
        </div>
        <h1 id="page-title">Reset Password</h1>
        <p class="status-text" data-token-status></p>

        <form class="reset-form" data-reset-form>
          <label for="new-password">New password</label>
          <div class="password-field">
            <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="6" required>
            <button class="password-toggle" type="button" aria-label="Show new password" aria-pressed="false" data-password-toggle="new-password">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5c4.6 0 8.4 3.1 10 7-1.6 3.9-5.4 7-10 7S3.6 15.9 2 12c1.6-3.9 5.4-7 10-7Zm0 2c-3.2 0-6 1.9-7.7 5 1.7 3.1 4.5 5 7.7 5s6-1.9 7.7-5C18 8.9 15.2 7 12 7Zm0 2.25A2.75 2.75 0 1 1 12 14.75 2.75 2.75 0 0 1 12 9.25Zm0 1.75a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3.28 2 18.7 18.7-1.28 1.28-3.07-3.07A11.43 11.43 0 0 1 12 20C7.4 20 3.6 16.9 2 13c.76-1.84 2.02-3.49 3.6-4.74L2 4.66 3.28 2Zm3.75 7.7A10.06 10.06 0 0 0 4.3 13C6 16.1 8.8 18 12 18c1.45 0 2.81-.39 4.03-1.1l-2.02-2.02A3.02 3.02 0 0 1 9.1 9.97L7.03 7.9Zm4.1 4.1a1.02 1.02 0 0 0 1.68-1.68l-1.68 1.68ZM12 6c4.6 0 8.4 3.1 10 7a12.1 12.1 0 0 1-2.63 3.76l-1.42-1.42A10.17 10.17 0 0 0 19.7 13C18 9.9 15.2 8 12 8c-.8 0-1.57.12-2.3.35L8.1 6.75A11.1 11.1 0 0 1 12 6Zm-.13 3.01L14.99 12A3 3 0 0 0 12 9l-.13.01Z"/>
              </svg>
            </button>
          </div>

          <label for="confirm-password">Confirm new password</label>
          <div class="password-field">
            <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" required>
            <button class="password-toggle" type="button" aria-label="Show confirmed password" aria-pressed="false" data-password-toggle="confirm-password">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5c4.6 0 8.4 3.1 10 7-1.6 3.9-5.4 7-10 7S3.6 15.9 2 12c1.6-3.9 5.4-7 10-7Zm0 2c-3.2 0-6 1.9-7.7 5 1.7 3.1 4.5 5 7.7 5s6-1.9 7.7-5C18 8.9 15.2 7 12 7Zm0 2.25A2.75 2.75 0 1 1 12 14.75 2.75 2.75 0 0 1 12 9.25Zm0 1.75a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3.28 2 18.7 18.7-1.28 1.28-3.07-3.07A11.43 11.43 0 0 1 12 20C7.4 20 3.6 16.9 2 13c.76-1.84 2.02-3.49 3.6-4.74L2 4.66 3.28 2Zm3.75 7.7A10.06 10.06 0 0 0 4.3 13C6 16.1 8.8 18 12 18c1.45 0 2.81-.39 4.03-1.1l-2.02-2.02A3.02 3.02 0 0 1 9.1 9.97L7.03 7.9Zm4.1 4.1a1.02 1.02 0 0 0 1.68-1.68l-1.68 1.68ZM12 6c4.6 0 8.4 3.1 10 7a12.1 12.1 0 0 1-2.63 3.76l-1.42-1.42A10.17 10.17 0 0 0 19.7 13C18 9.9 15.2 8 12 8c-.8 0-1.57.12-2.3.35L8.1 6.75A11.1 11.1 0 0 1 12 6Zm-.13 3.01L14.99 12A3 3 0 0 0 12 9l-.13.01Z"/>
              </svg>
            </button>
          </div>

          <button type="submit" data-submit>Reset password</button>
          <p class="form-message" data-message hidden></p>
        </form>
      </section>
    </main>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
